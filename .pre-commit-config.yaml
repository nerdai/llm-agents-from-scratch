---
default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-byte-order-marker
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  # mypy runs in the project environment (`uv sync --all-extras --dev`), not
  # pre-commit's isolated one: the optional extras (openai, anthropic, ollama,
  # mcp, a2a, qdrant, ...) must be installed, or `ignore_missing_imports`
  # turns their types into Any and every check involving them is skipped.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --config-file=mypy.ini -p llm_agents_from_scratch
        language: system
        types: [python]
        # checks the whole package, not just the changed files
        pass_filenames: false
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.23.1
    hooks:
      - id: toml-sort-fix
        exclude: ".*uv.lock"
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.5.8
    hooks:
      - id: uv-lock
